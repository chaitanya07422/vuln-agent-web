<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="refresh" content="4" />
    <title>ScanLead · Updating</title>
    <style>
      :root {
        --bg: #0a3d2e;
        --ink: #e8f0eb;
        --muted: #b7c9bf;
        --accent: #1a8f6a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
        background:
          radial-gradient(700px 380px at 12% 20%, rgba(26, 143, 106, 0.35), transparent 55%),
          var(--bg);
        color: var(--ink);
        padding: 1.5rem;
      }
      main {
        max-width: 26rem;
        text-align: center;
      }
      .pulse {
        width: 0.65rem;
        height: 0.65rem;
        margin: 0 auto 1.25rem;
        border-radius: 999px;
        background: var(--accent);
        animation: pulse 1.1s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 0.35;
          transform: scale(0.9);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 600;
        letter-spacing: -0.02em;
        margin: 0 0 0.75rem;
      }
      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.5;
        font-size: 0.95rem;
      }
      .hint {
        margin-top: 1.25rem;
        font-size: 0.75rem;
        color: var(--muted);
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="pulse" aria-hidden="true"></div>
      <h1>ScanLead is updating</h1>
      <p>A new version is coming online. This page refreshes automatically — usually a few seconds.</p>
      <p class="hint">You can also refresh manually.</p>
    </main>
  </body>
</html>
